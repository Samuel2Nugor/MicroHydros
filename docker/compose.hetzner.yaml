# Standalone Compose file for deploying the backend on the shared Hetzner
# server. Not layered on top of ../compose.yaml (Compose merges "ports:"
# lists across -f files rather than replacing them, which would try to bind
# the default ports too — already taken by the existing pm-iot-ui stack:
# 1883/1880/8086/3000). Deploy with just this file:
#
#   docker compose -f docker/compose.hetzner.yaml --env-file .env up -d
#
# See docker/README.md for service descriptions and
# docker/node-red/settings.hetzner.js for why Node-RED needs adminAuth here
# but not in local dev.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: microhydros-mosquitto
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - microhydros-network
    restart: unless-stopped

  node-red:
    image: nodered/node-red:5.0.7
    container_name: microhydros-node-red
    ports:
      - "1881:1880"
    volumes:
      - node_red_data:/data
      - ./node-red/settings.hetzner.js:/data/settings.js:ro
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    networks:
      - microhydros-network
    depends_on:
      - mosquitto
    restart: unless-stopped

  influxdb:
    image: influxdb:2.9.1
    container_name: microhydros-influxdb
    ports:
      - "8087:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    networks:
      - microhydros-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    container_name: microhydros-grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    networks:
      - microhydros-network
    depends_on:
      - influxdb
    restart: unless-stopped

networks:
  microhydros-network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  node_red_data:
  influxdb_data:
  influxdb_config:
  grafana_data:
